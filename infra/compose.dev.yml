# Local development database for the Campus Resource Booking System.
#
# Bound to 127.0.0.1 only: the database port is never exposed beyond this
# machine. Data lives in a named volume so records survive container restarts.
services:
  db:
    # Pinned major. Recorded as the tested image in docs/environment.md.
    image: postgres:17.6-alpine
    container_name: campus_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-campus_booking_dev}
      # Deterministic collation for reproducible ordering across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Consumed by db-init/01-roles-and-databases.sh, which runs inside the
      # container and therefore needs these in the container environment.
      TEST_DB_NAME: ${TEST_DB_NAME:-campus_booking_test}
      APP_MIGRATION_PASSWORD: ${APP_MIGRATION_PASSWORD:?APP_MIGRATION_PASSWORD is required}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?APP_RUNTIME_PASSWORD is required}
    ports:
      # 127.0.0.1 prefix keeps the port off the local network.
      - "127.0.0.1:5433:5432"
    volumes:
      - campus_booking_pgdata:/var/lib/postgresql/data
      # Creates the runtime role and the separate test database on first init.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-campus_booking_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  campus_booking_pgdata:
    name: campus_booking_pgdata
