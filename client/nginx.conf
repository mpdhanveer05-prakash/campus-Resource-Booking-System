# Public entry point: one origin serving the frontend and proxying /api.
#
# Keeping both behind a single origin is what lets the browser send the
# host-only session cookie on API requests without any CORS configuration.
#
# TLS is terminated here when certificates are mounted at /etc/nginx/tls. In
# a platform that terminates TLS upstream, use the plain HTTP server block and
# ensure that platform forwards X-Forwarded-Proto: https.

# Shared proxy and static configuration.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Session cookies are Secure in production, so they are only issued over
    # HTTPS. Redirect rather than serve a site whose login cannot work.
    # Health checks stay on HTTP so a load balancer can probe without TLS.
    location = /api/health/live {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/dev.crt;
    ssl_certificate_key /etc/nginx/tls/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Upload ceiling. The API enforces its own, smaller, JSON body limit.
    client_max_body_size 1m;

    # API traffic. This block precedes the SPA fallback, so an unknown /api
    # route reaches Express and returns its JSON 404 rather than index.html.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Express reads this to confirm the connection is secure before
        # issuing a Secure session cookie.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Fingerprinted build assets may be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback, applied to frontend routes only. A direct visit to
    # /my-bookings must load the application shell rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # The shell is revalidated every request, or a deploy leaves stale asset
    # references behind.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
